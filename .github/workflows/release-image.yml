name: Release image

on:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    # Must differ from ci.yml's group; the called workflow would otherwise wait on this run.
    group: release-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # The same gates a pull request runs, by reference rather than by copy.
    validate:
        uses: ./.github/workflows/ci.yml

    image:
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            # A docker tag admits only [A-Za-z0-9_.-], but `v*` matches build metadata too:
            # v1.0.0+build.1 is a legal git tag and an illegal image tag, and `docker build` would
            # refuse it. Fold everything else to a dash. The tag travels as an env value and is
            # never interpolated into shell text — a ref name may legally contain a backtick or a $.
            - name: normalize the git tag into a docker tag
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  FOLDED=$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9_.-' '-')
                  # Folding is lossy — v1.0.0+build.1 and v1.0.0-build.1 collapse to one string —
                  # and a docker tag is 128 characters at most, which a git tag is not. Anything
                  # the fold changed, or that is too long to carry, keeps a digest of the original
                  # so two releases can never land on one tag. 120 + '-' + 7 = the 128 limit.
                  if [ "$FOLDED" != "$TAG" ] || [ ${#TAG} -gt 128 ]; then
                      FOLDED="$(printf '%s' "$FOLDED" | cut -c1-120)-$(printf '%s' "$TAG" | sha1sum | cut -c1-7)"
                  fi
                  printf 'IMAGE_TAG=%s\n' "$FOLDED" >>"$GITHUB_ENV"
            # The command AGENTS.md documents, plus the tag. No registry, no credential and no
            # build arg — the runtime stage takes none, and .dockerignore keeps .env out.
            - name: docker build --target runtime
              run: docker build -f docker/Dockerfile --target runtime -t "factory-ai:$IMAGE_TAG" .
            # The tarball and the artifact use the folded tag too: a ref name may contain a pipe,
            # which an artifact name may not, and the digest suffix is what keeps two folded refs
            # from sharing a filename. The original is on the run itself (github.ref_name).
            - name: docker save
              run: docker save "factory-ai:$IMAGE_TAG" -o "factory-ai-$IMAGE_TAG.tar"
            - uses: actions/upload-artifact@v4
              with:
                  name: factory-ai-image-${{ env.IMAGE_TAG }}
                  path: factory-ai-${{ env.IMAGE_TAG }}.tar
                  retention-days: 7
