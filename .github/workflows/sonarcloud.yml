name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # Sonar attributes issues by blame and derives the new-code period from it. A shallow
      # clone does not fail — it reports the whole repository as new code on every run.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      # esbuild has an install script and still transforms fine without it; the browsers
      # @playwright/test would fetch are not used by this job.
      - run: npm ci --ignore-scripts

      # Lint + format verification over the four packages and the root config files; offline and fast.
      - run: npm run lint

      # The suite is offline: no token, no quota, no database, no docker. But server/test and
      # web/test resolve @factory-ai/core to core/dist, so the build is not optional here.
      - run: npm run build -w core
      - run: npm test -- --coverage

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # coverage/ is excluded as a source but still read as a report: lcov-report/ is
          # generated HTML and JS, and Sonar would otherwise analyze it as our code.
          args: >
            -Dsonar.projectKey=AndrewGrachov_factory-ai
            -Dsonar.organization=andrewgrachov
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=coverage/**
