name: Deploy documentation

on:
    push:
        branches: [main]
        paths:
            - 'docs-site/**'
            - 'scripts/check-docs.mjs'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/docs-deploy.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Validate, build, and upload documentation
              uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
              with:
                  node-version: 24
                  build-cmd: npm run docs:check
                  out-dir: docs-site/dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
