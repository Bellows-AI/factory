services:
    # The dashboard, running the SAME `npm run dev` you would run on the host — tsx watch for the
    # API, Vite with HMR for the SPA — against the working tree bind-mounted in. This file is an
    # infrastructure wrapper, not a shipping vehicle: an edit is live without a rebuild, and there is
    # nothing to rebuild anyway because the image carries no source.
    #
    # It used to build and serve `docker/Dockerfile`'s baked `runtime` stage, which meant every edit
    # needed a `--build` — a full npm ci plus a four-package tsc — and an `up` without one silently
    # served the previous build. That stage still exists and is still what deploys; it is just not
    # what compose runs:
    #
    #   docker build -f docker/Dockerfile --target runtime -t factory-ai .
    dashboard:
        build:
            context: .
            dockerfile: docker/Dockerfile
            # NOT the default (last) stage, which is `runtime`. See docker/Dockerfile.
            target: dev
        # `npm install` first because /app/node_modules is a named volume seeded from the image, so
        # it is only as fresh as the last image build — this reconciles it with the working tree's
        # lockfile, and costs a few seconds once warm.
        command: sh -c 'npm install && npm run dev'
        # There is no application-level auth, so the localhost bind is the access control.
        ports:
            - '127.0.0.1:8080:8080'
            # Vite. `/api` is proxied from here to the API in the same container, so either port is
            # a working dashboard; this one hot-reloads the SPA and 8080 does not serve it at all in
            # this mode (WEB_ROOT is unset without a build).
            - '127.0.0.1:5173:5173'
        # Every ${VAR} below is substituted from the repo-root .env, which compose reads on its own
        # — that is where the App private key comes from, and .env is gitignored and dockerignored so it
        # never enters an image layer.
        #
        # Deliberately NOT `env_file: .env`. That injects the whole file into the container, which
        # would hand the process variables meant only for host scripts (DATABASE_URL among them,
        # pointing at 127.0.0.1 — a different database from the one this file provisions) and would
        # bypass the empty-defaulting below. The list here is the container's contract; .env only
        # fills it in.
        #
        # The bind mount below does put .env inside the container, and `npm run dev -w server` hands
        # it to node --env-file-if-exists. That does not undo the paragraph above: node lets a real
        # environment variable win over the file, and every variable that matters is set here — so
        # the host's DATABASE_URL, pointing at a different database, cannot take hold.
        environment:
            # The repo-read credential AND the repo list, both from one GitHub App installation.
            # There is no mode to select: the id and the key are required, and a stack without them
            # refuses to boot saying which one is missing.
            GITHUB_APP_ID: ${GITHUB_APP_ID:-}
            # Optional: discovered from the App when the App is installed in exactly one place.
            GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
            # The PEM, or its base64 — a one-line value survives .env far better than a PEM does.
            # Alternatively mount the .pem and point GITHUB_APP_PRIVATE_KEY_FILE at it.
            GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
            GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
            # Empty-defaulted, unlike most of this block, so an unset value stays unset: that id
            # leads every stored primary key, and a literal default here would silently point an
            # existing database's dashboard at a different, empty partition on every start.
            ORG_ID: ${ORG_ID:-}
            ORG_NAME: ${ORG_NAME:-}
            # A literal default, unlike the ORG_* pair above, and the volume below is mounted to
            # match: this is a path INSIDE the container, so a host value from .env would be a path
            # on the host that cannot exist here, and clobbering it is the correct outcome. Those
            # two are host-independent identifiers; this one is not.
            #
            # `up` no longer clones anything on its own. Checkouts are per member now, at
            # <root>/<orgId>/<userId>/<repo>, and they are created when somebody signs in and picks
            # repositories from the dashboard. Set this empty to switch the feature off entirely.
            ORG_WORKSPACE_ROOT: ${ORG_WORKSPACE_ROOT:-/workspaces}
            BASE_BRANCH: ${BASE_BRANCH:-dev}
            # The only cache floor. CACHE_TTL_SECONDS is gone and is now fatal if set.
            SYNC_TTL_SECONDS: ${SYNC_TTL_SECONDS:-60}
            TELEMETRY_SOURCE: ${TELEMETRY_SOURCE:-postgres}
            TELEMETRY_TTL_SECONDS: ${TELEMETRY_TTL_SECONDS:-30}
            # Required, and pointed at the service this file provisions. Not overridable from the
            # host: a factory_dev on the host is a different database from this one, and pointing
            # the container at it would silently split history across two.
            DATABASE_URL: postgres://factory:factory@timescale:5432/factory_dev
            # A literal, and the one place in this file .env is deliberately NOT allowed to win.
            # `none` is still a supported mode and still the default everywhere else — `npm run
            # seed`, `verify:ui` and `scripts/test-jobs.sh` need it, and a clone with no OAuth app
            # has no way to obtain one — but this stack keeps its checkouts and runs POST /api/jobs,
            # so it identifies its callers. A mode that could be turned off by editing .env is not a
            # wall. Flip this line to open the port; nothing else will do it for you. See
            # docs/auth.md.
            AUTH_MODE: github
            GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
            GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
            SESSION_SECRET: ${SESSION_SECRET:-}
            PUBLIC_URL: ${PUBLIC_URL:-}
            COOKIE_SECURE: ${COOKIE_SECURE:-}
            AUTH_BOOTSTRAP_ADMIN: ${AUTH_BOOTSTRAP_ADMIN:-}
            # Members of this GitHub organization admit themselves on first sign-in. Empty keeps
            # invite-only membership, where an admin names every login in advance.
            AUTH_AUTO_JOIN_GITHUB_ORG: ${AUTH_AUTO_JOIN_GITHUB_ORG:-}
            INGEST_TOKEN: ${INGEST_TOKEN:-}
            # No AUTH_ALLOW_PUBLIC_BIND. It used to be required here: the Dockerfile sets
            # HOST=0.0.0.0, and loadConfig refuses `none` on a non-loopback host, so an open stack
            # needed the hatch to boot at all. With AUTH_MODE pinned to github above there is
            # nothing to except — put it back if you ever flip that line.
            # Vite only, and only ever set here: on the host its absence leaves Vite bound to
            # loopback, which is the access control there. Inside the container a loopback bind is
            # unreachable from the published port and `curl :5173` simply hangs.
            VITE_DEV_HOST: '0.0.0.0'
        volumes:
            # The working tree, live. This is the whole point of the file. Note that most variables
            # above are *real* values, not absent ones, so they win over anything the mounted .env
            # would hand node's --env-file; the environment-first contract stays intact. The ORG_*
            # three are the exception, deliberately: see the comment on them.
            - .:/app
            # node_modules must NOT come from the host: the host tree holds darwin binaries (esbuild
            # and rollup among them) that cannot execute in a Linux container. These named volumes
            # shadow the bind mount at each workspace's node_modules, so the container keeps its own
            # linux-native install — and keeps it across `down`, which is what makes a restart take
            # about ten seconds instead of several minutes. They are seeded from the image, where
            # the deps stage already ran npm ci, so even the first `up` starts warm.
            #
            # core/dist is deliberately NOT one of these, tempting as it looks. tsc writes
            # core/tsconfig.tsbuildinfo *beside* dist rather than inside it, so that file always
            # comes from the bind mount: shadowing dist alone leaves tsc reading a buildinfo that
            # says the output is current while the directory it names is empty, and it emits
            # nothing. The server then dies on "Cannot find module @factory-ai/core/dist/index.js",
            # which reads as a broken image rather than as a mount. Sharing both keeps the pair
            # consistent, and the emitted JS is platform-independent, so either side can build it.
            - node-modules:/app/node_modules
            - core-node-modules:/app/core/node_modules
            - server-node-modules:/app/server/node_modules
            - web-node-modules:/app/web/node_modules
            - driver-node-modules:/app/driver/node_modules
            # The checkouts ORG_WORKSPACE_ROOT points at. A named volume rather than part of the
            # bind mount above: these are clones of other people's repositories, and they have no
            # business landing in this working tree. Reach them with
            # `docker compose exec dashboard sh` or `docker cp`.
            - workspaces:/workspaces
        depends_on:
            timescale:
                condition: service_healthy
        # Not `unless-stopped`. A dev process that exits on a syntax error should stay exited and
        # show you the error, not loop.
        restart: 'no'
        healthcheck:
            # alpine has no curl, so probe with node's global fetch.
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            # Generous because a cold `up` installs dependencies and builds core before the port
            # answers. 10s would mark that unhealthy and hold up everything with a depends_on.
            start_period: 180s

    # Claims jobs from the board and spawns a runner per job (claude-executor, or opencode-executor
    # under RUNNER_CLI=opencode). Part of the default `docker compose up` by operator decision:
    # it mounts the docker socket, which is root on the host — see docs/security.md for what that
    # means before running this file anywhere shared. The runner image is built once:
    #
    #   docker build -t claude-executor docker/claude-executor   # or opencode-executor
    driver:
        build:
            context: .
            dockerfile: docker/driver.Dockerfile
        environment:
            JOB_BOARD_URL: http://dashboard:8080
            # The worker token, from `npm run worker-token -- --name driver-1`. Only needed when the
            # dashboard runs AUTH_MODE=github; against an open board it stays empty and the header
            # is omitted entirely rather than sent blank.
            JOB_BOARD_TOKEN: ${JOB_BOARD_TOKEN:-}
            # No ORG_ID. It only ever built the runner's WORKDIR as /workspaces/<org>, and the board
            # sends `workspacePath` on the claim now: checkouts are per member, so only the board —
            # which created the directory — knows where a given job's tree is.
            # Empty by default on purpose: an explicit EXECUTOR_IMAGE reads as "operator knows
            # better" and wins over everything, so the default has to come from RUNNER_CLI inside
            # the driver — claude-executor, or opencode-executor under RUNNER_CLI=opencode. An
            # image that does not speak RUNNER_CLI's dialect is a mismatch nothing guards against.
            EXECUTOR_IMAGE: ${EXECUTOR_IMAGE:-}
            # Which CLI the runner image speaks. Refused at startup alongside Remote Control and
            # RUNNER_SKIP_PERMISSIONS — both are claude-code-only. See docs/jobs.md.
            RUNNER_CLI: ${RUNNER_CLI:-claude-code}
            # A volume name as the daemon knows it, hence the compose project prefix. Override if
            # the project directory is not `factory-ai`.
            WORKSPACE_VOLUME: ${WORKSPACE_VOLUME:-factory-ai_workspaces}
            # Puts the runner on this compose network, which is the only place `collector` resolves.
            # Without it the agent still works and its telemetry silently goes nowhere.
            RUNNER_NETWORK: ${RUNNER_NETWORK:-factory-ai_default}
            DRIVER_CONCURRENCY: ${DRIVER_CONCURRENCY:-2}
            DRIVER_POLL_MS: ${DRIVER_POLL_MS:-5000}
            DRIVER_LEASE_SECONDS: ${DRIVER_LEASE_SECONDS:-300}
            DRIVER_JOB_TIMEOUT_MS: ${DRIVER_JOB_TIMEOUT_MS:-1800000}
            # Off by default. On, the agent edits and runs whatever it likes inside the runner
            # without asking; off, most jobs stall at a permission prompt nobody can answer. Read
            # docs/jobs.md before setting it.
            RUNNER_SKIP_PERMISSIONS: ${RUNNER_SKIP_PERMISSIONS:-}
            # Forwarded to the runner by NAME, so the value never appears in a `docker run` argv.
            CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
        volumes:
            # Root on the host, in one line. See docs/security.md.
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            dashboard:
                condition: service_healthy
        restart: unless-stopped

    # TimescaleDB rather than plain Postgres: metric_point is a real time-series table and
    # becomes a hypertable, while session_branch stays relational so the attribution join is
    # ordinary SQL. One extension, one driver, one dialect.
    timescale:
        image: timescale/timescaledb:latest-pg17
        environment:
            POSTGRES_USER: factory
            POSTGRES_PASSWORD: factory
            # Two databases, deliberately. `npm run test:db` truncates its tables, so it is
            # fenced off to factory_test by a name check in the suite — pointing it at
            # factory_dev would silently destroy backfilled history.
            POSTGRES_DB: factory_dev
        # Localhost-only, same posture as the dashboard: the bind is the access control.
        # Published because `npm run test:db` and psql both run from the host.
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - timescale-data:/var/lib/postgresql/data
            # Only runs on a fresh volume, which is why the README also gives the manual
            # `create database` for an existing one.
            - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U factory -d factory_dev']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    # Receives from Claude Code on the host and forwards to the dashboard's ingest route.
    # Localhost-only, no auth, no TLS — same posture as everything else here.
    collector:
        image: otel/opentelemetry-collector-contrib:latest
        command: ['--config=/etc/otel/config.yaml']
        volumes:
            - ./docker/otel-collector.yaml:/etc/otel/config.yaml:ro
        ports:
            - '127.0.0.1:4317:4317'
            - '127.0.0.1:4318:4318'
        depends_on:
            - dashboard
        restart: unless-stopped

volumes:
    timescale-data:
    # The organization's checkouts. Survives `docker compose down`; `down -v` discards them, and
    # they are re-cloned on the next boot.
    workspaces:
    # The container's linux-native dependency install, one per workspace. `down -v` discards these
    # too, which is the way to force a clean reinstall — and makes the next `up` slow, once.
    node-modules:
    core-node-modules:
    server-node-modules:
    web-node-modules:
    driver-node-modules:
