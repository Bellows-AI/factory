# A single-node local Kubernetes stack: the real board behind real GitHub sign-in, running the
# real runner images — the same claude-executor and opencode-executor `make runners` builds for
# the docker executor. A stub image cannot run a repository job at all: the pre-run worktree sync
# runs `node` inside the executor image, so a stub without it fails every such job before it starts.
#
# This file holds no credential. The auth, App and model values come from the repo-root .env, rendered by
# scripts/k8s-local-values.mjs and piped to helm on stdin, so no secret lands in a file or on a
# command line:
#
#   kind create cluster --name factory
#   docker build -f docker/Dockerfile --target runtime -t factory-ai .
#   docker build -f docker/driver.Dockerfile -t factory-driver .
#   make runners
#   for image in factory-ai factory-driver claude-executor opencode-executor; do
#       kind load docker-image "$image" --name factory
#   done
#   helm install factory-state charts/factory-local-state
#   node scripts/k8s-local-values.mjs | helm install dev charts/factory -f charts/factory/values-local.yaml -f -
#
# `make start` is the same sequence as one command. See charts/factory/README.md for the walkthrough.

# Local builds are tagged `latest` (the commands above), not the chart's appVersion.
dashboard:
    image:
        repository: factory-ai
        tag: latest
    workspaceRoot: /workspaces

# The database and the checkouts live in the `factory-state` release (charts/factory-local-state),
# not this one, so uninstalling this release keeps both. These two values are that release's
# object names: `<release>-timescale` and `<release>-workspaces`.
database:
    url: postgres://factory:factory@factory-state-timescale:5432/factory_dev
    # The database pod already pulled this image onto the one node, so the wait costs no pull.
    waitImage: timescale/timescaledb:latest-pg17

workspaces:
    existingClaim: factory-state-workspaces

driver:
    image:
        repository: factory-driver
        tag: latest
    executorImages:
        claudeCode: claude-executor
        opencode: opencode-executor
