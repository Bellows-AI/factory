{{- if .Values.secret.create }}
{{/*
The dashboard's credentials. Every consumer reads them through `valueFrom.secretKeyRef`, so no
value ever lands in a pod spec (readable by anyone who can `get pods`) or a command line. The
App private key is the worst secret here to leak — docs/security.md — and it reaches the process
the same way compose passes it: as an environment variable the image never baked in.
*/}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "factory.secretName" . }}
    labels:
        {{- include "factory.labels" . | nindent 8 }}
type: Opaque
stringData:
    github-app-private-key: {{ .Values.github.appPrivateKey | quote }}
    github-oauth-client-secret: {{ .Values.secret.oauthClientSecret | quote }}
    session-secret: {{ .Values.secret.sessionSecret | quote }}
    ingest-token: {{ .Values.telemetry.ingestToken | quote }}
    job-board-token: {{ .Values.secret.jobBoardToken | quote }}
{{- end }}
{{- if and .Values.secret.create (not .Values.runner.credentialsExistingSecret) }}
---
{{/*
The runner credentials, one key per RUNNER_ENV name — the k8s form of `-e NAME`: the names travel
in the pod spec, the values stay here. A runner pod reads them with `valueFrom.secretKeyRef`, so
`kubectl get pods -o yaml` shows the reference and never the credential.
*/}}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "factory.runnerSecretName" . }}
    labels:
        {{- include "factory.labels" . | nindent 8 }}
type: Opaque
stringData:
    CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.runner.claudeCodeOauthToken | quote }}
    ANTHROPIC_API_KEY: {{ .Values.runner.anthropicApiKey | quote }}
{{- end }}
