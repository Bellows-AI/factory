{{/*
Render-time refusals for configurations the server would otherwise refuse at boot, one crash loop
later. Every check mirrors a loadConfig rule (server/src/config.ts) — or a chart-side
impossibility, like a Secret nothing creates or an Ingress that answers no host its operator's
origin lives on — and names the value to set.
Values that live in `secret.existingSecret` cannot be seen from here — the server still names
those at boot, which is why every such key is `optional` in the pod spec: a missing key reads as
the server's own message, never as an opaque CreateContainerConfigError.
*/}}
{{- if and (not .Values.secret.create) (not .Values.secret.existingSecret) }}
{{- fail "secret.create is false but secret.existingSecret is empty: the pods would reference a Secret nothing creates" }}
{{- end }}
{{- if not .Values.auth.publicUrl }}
{{- fail "auth.publicUrl is required: the origin GitHub redirects back to" }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts is required when ingress.enabled: the Ingress would answer no host at all" }}
{{- end }}
{{- $publicHost := regexFind "//[^:/]+" .Values.auth.publicUrl | trimPrefix "//" }}
{{- if not $publicHost }}
{{- fail (printf "auth.publicUrl must be an absolute origin (scheme://host) when ingress.enabled: no host could be read from %q" .Values.auth.publicUrl) }}
{{- end }}
{{- if not (has $publicHost .Values.ingress.hosts) }}
{{- fail (printf "auth.publicUrl host %q is not among ingress.hosts: GitHub redirects to auth.publicUrl and the Ingress answers ingress.hosts" $publicHost) }}
{{- end }}
{{- end }}
{{- if not .Values.auth.oauthClientId }}
{{- fail "auth.oauthClientId is required" }}
{{- end }}
{{- if .Values.secret.create }}
{{- if not .Values.secret.oauthClientSecret }}
{{- fail "secret.oauthClientSecret is required" }}
{{- end }}
{{- if lt (len .Values.secret.sessionSecret) 32 }}
{{- fail "secret.sessionSecret of at least 32 characters is required (openssl rand -hex 32)" }}
{{- end }}
{{- if lt (len .Values.secret.jobBoardToken) 32 }}
{{- fail "secret.jobBoardToken of at least 32 characters is required (openssl rand -hex 32): the driver's credential on the worker routes" }}
{{- end }}
{{- end }}
{{- if not .Values.dashboard.offline }}
{{- if not .Values.github.appId }}
{{- fail "github.appId is required: the repo list and the repo-read credential are the GitHub App's (set dashboard.offline=true for the code-only no-fetch entry)" }}
{{- end }}
{{- if and .Values.secret.create (not .Values.github.appPrivateKey) }}
{{- fail "github.appPrivateKey is required alongside github.appId" }}
{{- end }}
{{- end }}
