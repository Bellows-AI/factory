{{/*
The driver's identity and permissions, in the namespace it runs in — a Role and never a
ClusterRole, because its reach is exactly the runner Jobs it creates, in the namespace the chart
installed it to. The verbs are the calls the kubernetes runner makes and nothing more: create a
Job, read its status, delete it (kill and the re-claim fence), list its pods, read a pod's log.
`secrets` is the claim env's per-job Secret: create it before the Job, read nothing back, delete it
with the runner. No `get` on secrets is granted and no wildcard.

What this Role alone does NOT give, stated because it reads as if it did: RBAC cannot scope a verb
to a name prefix, so `delete` reaches every Secret in the namespace, and `create` on pods and Jobs
is `read` on every Secret — a pod the driver specs may mount any Secret here, the dashboard's App
key included. The runners (agent-written code) share this namespace because the workspaces claim
they mount is namespaced and shared with the dashboard. The fence is driver-admission.yaml: an
admission policy bound to this ServiceAccount that admits only pod specs referencing the driver's
own per-attempt Secrets, and deletes only of objects it labelled `factory.job`.
`configmaps` is the checkout claim that makes the re-claim fence atomic (issue #32): one ConfigMap
per job id, POSTed to take the checkout (409 means another attempt holds it), read to order the
contenders, deleted to release or take over. `get` is safe HERE and only here — the claim carries
a holder token and an attempt number, both already known to the driver, and never secret material,
which is exactly why the claim is not a Secret. The grant is namespace-wide on ConfigMaps — RBAC
cannot scope it to `factory-job-*-claim` names — so a compromised driver can read the namespace's
configuration, not its credentials: the line this Role has always drawn.
`pods` create/delete are the gate runs and the auxiliary services: a gate run is a Job (batch,
already granted), but a service is a long-running neighbor pod, and its headless DNS Service is a
`services` object — created before the runner starts, deleted with the attempt. No `pods/exec` is
granted, ever: the driver runs containers it specs itself, and arbitrary exec into a running pod
is a capability this design has never needed.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "factory.fullname" . }}-driver
    labels:
        {{- include "factory.labels" . | nindent 8 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "factory.fullname" . }}-driver
    labels:
        {{- include "factory.labels" . | nindent 8 }}
rules:
    # `list` on jobs and services is the re-claim fence: its sweep is a collection GET, and a
    # collection GET needs the list verb — a rule without it makes every fence round a 403.
    - apiGroups: ['batch']
      resources: ['jobs']
      verbs: ['create', 'get', 'delete', 'list']
    - apiGroups: ['']
      resources: ['secrets']
      verbs: ['create', 'delete']
    - apiGroups: ['']
      resources: ['configmaps']
      verbs: ['create', 'get', 'delete']
    - apiGroups: ['']
      resources: ['pods']
      verbs: ['create', 'delete', 'list']
    - apiGroups: ['']
      resources: ['services']
      verbs: ['create', 'delete', 'list']
    - apiGroups: ['']
      resources: ['pods/log']
      verbs: ['get']
    # The runner vitals: `metrics.k8s.io` is served by the metrics-server a cluster may or may
    # not run — absent, the driver's sample read fails and the dashboard renders no vitals
    # (null is "no fresh sample", never an error); present, this grant is what makes the read.
    # One resource, one verb: the driver reads a single pod's usage, nothing else.
    - apiGroups: ['metrics.k8s.io']
      resources: ['pods']
      verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "factory.fullname" . }}-driver
    labels:
        {{- include "factory.labels" . | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "factory.fullname" . }}-driver
subjects:
    - kind: ServiceAccount
      name: {{ include "factory.fullname" . }}-driver
      namespace: {{ .Release.Namespace }}
