{{/*
The dashboard: API and SPA on one port, the same `runtime` stage compose does NOT run and the
Dockerfile calls "what deploys". Its environment block mirrors docker-compose.yml's dashboard
service line for line — the chart sets the same environment the compose file sets, which is the
repo's only configuration mechanism.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "factory.fullname" . }}
    labels:
        {{- include "factory.labels" . | nindent 8 }}
spec:
    replicas: {{ .Values.dashboard.replicas }}
    selector:
        matchLabels:
            app.kubernetes.io/name: factory
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: dashboard
    template:
        metadata:
            labels:
                {{- include "factory.labels" . | nindent 16 }}
                app.kubernetes.io/component: dashboard
        spec:
            # The server's migration retry gives up after ~55s and then keeps serving with no
            # tables — every DB-backed route a 500, and no client-side polling recovers it. A
            # database that is not accepting connections yet (a cold local node still pulling its
            # image, a managed instance mid-failover) must hold the server back, not strand it, so
            # the pod waits on pg_isready against the same DATABASE_URL the server reads.
            initContainers:
                - name: wait-for-database
                  image: {{ .Values.database.waitImage }}
                  command: ['sh', '-c', 'until pg_isready -q -d "$DATABASE_URL"; do sleep 1; done']
                  env:
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: database-url
            containers:
                - name: dashboard
                  image: {{ .Values.dashboard.image }}
                  imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
                  {{- if .Values.dashboard.offline }}
                  # The offline profile: the code-only no-fetch entry. Same image, same routes;
                  # nothing is fetched or cloned, and the App credential is not needed.
                  command: ['node', 'server/dist/offline.js']
                  {{- end }}
                  ports:
                      - name: http
                        containerPort: {{ .Values.dashboard.port }}
                  env:
                      # The repo-read credential AND the repo list, both from one GitHub App
                      # installation. Required: without an id and a key the server refuses to boot
                      # — there is no no-fetch mode to fall back to.
                      - name: GITHUB_APP_ID
                        value: {{ .Values.github.appId | quote }}
                      - name: GITHUB_APP_PRIVATE_KEY
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: github-app-private-key
                      # The organizations are the App's installations, materialized at sign-in
                      # (#99) — there is no org env to set. Install the App on every account this
                      # deployment should serve.
                      # The checkouts. Same path the runners mount the claim at: the board writes
                      # there, and `workspacePath` on a claim is relative to this root.
                      - name: ORG_WORKSPACE_ROOT
                        value: {{ .Values.dashboard.workspaceRoot | quote }}
                      - name: TELEMETRY_SOURCE
                        value: {{ .Values.telemetry.source | quote }}
                      - name: TELEMETRY_TTL_SECONDS
                        value: {{ .Values.telemetry.ttlSeconds | quote }}
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: database-url
                      # The wall. Chart default `github`, as compose pins it — this deployment holds
                      # checkouts and serves a route that runs shell commands.
                      - name: AUTH_MODE
                        value: {{ .Values.auth.mode | quote }}
                      {{- if .Values.auth.allowPublicBind }}
                      # Only set when asked for: it excepts an open AUTH_MODE from the loopback rule.
                      - name: AUTH_ALLOW_PUBLIC_BIND
                        value: {{ .Values.auth.allowPublicBind | quote }}
                      {{- end }}
                      - name: GITHUB_OAUTH_CLIENT_ID
                        value: {{ .Values.auth.oauthClientId | quote }}
                      - name: GITHUB_OAUTH_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: github-oauth-client-secret
                      - name: SESSION_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: session-secret
                      # Under mode=github this is required — loadConfig refuses to boot without an
                      # origin GitHub can redirect back to.
                      - name: PUBLIC_URL
                        value: {{ .Values.auth.publicUrl | quote }}
                      - name: COOKIE_SECURE
                        value: {{ .Values.auth.cookieSecure | quote }}
                      - name: INGEST_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: ingest-token
                      # The App's installation webhook: present, the route verifies GitHub's HMAC
                      # against it; empty, the route does not exist at all.
                      - name: GITHUB_WEBHOOK_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: github-webhook-secret
                      # The shared board secret — the same value the driver presents. Required in
                      # github mode: the server refuses to boot without it, which is what names
                      # the missing key. Optional here so the AUTH_MODE=none local profile, which
                      # validates no secret, boots without it.
                      - name: JOB_BOARD_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: {{ include "factory.secretName" . }}
                                key: job-board-token
                                optional: true
                  {{- with .Values.dashboard.resources }}
                  resources:
                      {{- toYaml . | nindent 20 }}
                  {{- end }}
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      initialDelaySeconds: 15
                      periodSeconds: 30
                  volumeMounts:
                      - name: workspaces
                        mountPath: {{ .Values.dashboard.workspaceRoot }}
            volumes:
                - name: workspaces
                  persistentVolumeClaim:
                      claimName: {{ include "factory.workspaceClaim" . }}
