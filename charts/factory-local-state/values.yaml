# The state a local `factory` release runs against, in its own release so the app release can be
# uninstalled and reinstalled without taking the database or the checkouts with it. Local only:
# a real deployment points the factory chart's `database.url` at a managed database and lets the
# factory chart create its own ReadWriteMany workspaces claim. Nothing here is a production shape.

timescale:
    # The same plain Postgres container compose runs. The key keeps the name `timescale`
    # because `<release>-timescale` is the object name values-local.yaml, the Makefile and
    # scripts/test-k8s.sh all reach for; the extension itself is gone (#371).
    image: postgres:17
    user: factory
    password: factory
    database: factory_dev
    storageSize: 10Gi
    resources: {}

# One node, so ReadWriteOnce: the local provisioner cannot serve ReadWriteMany.
workspaces:
    storageSize: 20Gi
    accessModes:
        - ReadWriteOnce
    storageClass: ''
