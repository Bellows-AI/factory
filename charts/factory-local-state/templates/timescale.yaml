{{/*
The local database — the same plain Postgres container compose runs, not the upstream Helm
chart: one deployment, one claim, no subchart dependency. Plain Postgres, no extension: since
#371 metric_point is a declaratively-partitioned table. Production does not run this; it points
the factory chart's `database.url` at a managed instance. The object name `<release>-timescale`
outlives the extension — renaming it is a sweep of test-k8s.sh, the Makefile and values-local.yaml,
and buys nothing.
*/}}
apiVersion: v1
kind: Service
metadata:
    name: {{ .Release.Name }}-timescale
    labels:
        {{- include "state.labels" . | nindent 8 }}
        app.kubernetes.io/component: timescale
spec:
    type: ClusterIP
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
    selector:
        {{- include "state.labels" . | nindent 8 }}
        app.kubernetes.io/component: timescale
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ .Release.Name }}-timescale
    labels:
        {{- include "state.labels" . | nindent 8 }}
        app.kubernetes.io/component: timescale
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: {{ .Values.timescale.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Release.Name }}-timescale
    labels:
        {{- include "state.labels" . | nindent 8 }}
        app.kubernetes.io/component: timescale
spec:
    replicas: 1
    strategy:
        # One replica holding one claim: a rolling update would try to run two writers on it.
        type: Recreate
    selector:
        matchLabels:
            {{- include "state.labels" . | nindent 12 }}
            app.kubernetes.io/component: timescale
    template:
        metadata:
            labels:
                {{- include "state.labels" . | nindent 16 }}
                app.kubernetes.io/component: timescale
        spec:
            containers:
                - name: timescale
                  image: {{ .Values.timescale.image }}
                  ports:
                      - name: postgres
                        containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        value: {{ .Values.timescale.user | quote }}
                      - name: POSTGRES_PASSWORD
                        value: {{ .Values.timescale.password | quote }}
                      - name: POSTGRES_DB
                        value: {{ .Values.timescale.database | quote }}
                  {{- with .Values.timescale.resources }}
                  resources:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
                  readinessProbe:
                      exec:
                          command: ['pg_isready', '-U', {{ .Values.timescale.user | quote }}, '-d', {{ .Values.timescale.database | quote }}]
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: {{ .Release.Name }}-timescale
